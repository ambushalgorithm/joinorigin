<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-hidden="true">
  <!-- Docs scene: stacked document layers + horizontal Matrix node line with encrypted-lock glyph. -->
  <defs>
    <linearGradient id="docs-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7DF9"/>
      <stop offset="1" stop-color="#8AB4FF"/>
    </linearGradient>
  </defs>

  <!-- Soft radial glow behind the focal motif -->
  <circle cx="280" cy="185" r="160" fill="#8AB4FF" opacity="0.13"/>

  <!-- Stacked document layers (3 rounded rects, gradient outline) -->
  <g fill="none" stroke="#2C313A" stroke-width="2" opacity="0.9">
    <rect x="150" y="120" width="260" height="150" rx="10"/>
    <rect x="165" y="105" width="260" height="150" rx="10"/>
    <rect x="180" y="90" width="260" height="150" rx="10"/>
  </g>
  <rect x="180" y="90" width="260" height="150" rx="10" fill="none" stroke="url(#docs-grad)" stroke-width="2.5"/>

  <!-- Document body lines -->
  <g stroke="#9AA3B2" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="205" y1="115" x2="380" y2="115"/>
    <line x1="205" y1="132" x2="360" y2="132"/>
    <line x1="205" y1="149" x2="380" y2="149"/>
    <line x1="205" y1="166" x2="330" y2="166"/>
    <line x1="205" y1="183" x2="370" y2="183"/>
  </g>
  <circle cx="205" cy="205" r="4" fill="#8AB4FF"/>
  <line x1="218" y1="205" x2="380" y2="205" stroke="#9AA3B2" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- Matrix node line below the documents -->
  <g stroke="#2C313A" stroke-width="2" opacity="0.9">
    <line x1="120" y1="300" x2="440" y2="300"/>
  </g>
  <circle cx="140" cy="300" r="12" fill="#181B21" stroke="#8AB4FF" stroke-width="2.5"/>
  <circle cx="200" cy="300" r="12" fill="#181B21" stroke="#8AB4FF" stroke-width="2.5"/>
  <circle cx="260" cy="300" r="12" fill="#181B21" stroke="#8AB4FF" stroke-width="2.5"/>
  <circle cx="320" cy="300" r="12" fill="url(#docs-grad)"/>
  <circle cx="380" cy="300" r="12" fill="#181B21" stroke="#8AB4FF" stroke-width="2.5"/>
  <circle cx="430" cy="300" r="12" fill="#181B21" stroke="#8AB4FF" stroke-width="2.5"/>

  <!-- Encrypted-lock glyph (Matrix persistence) -->
  <g transform="translate(320 300)">
    <rect x="-9" y="-2" width="18" height="14" rx="3" fill="#181B21" stroke="#8AB4FF" stroke-width="2"/>
    <path d="M-5-2v-4a5 5 0 0 1 10 0v4" fill="none" stroke="#8AB4FF" stroke-width="2"/>
    <circle cx="0" cy="5" r="2.2" fill="#8AB4FF"/>
  </g>
</svg>
