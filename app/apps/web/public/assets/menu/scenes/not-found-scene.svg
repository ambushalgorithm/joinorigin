<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420" role="img" aria-hidden="true">
  <!-- Not-found scene: large glowing node with a dashed "missing link" arc to a small faint node. -->
  <defs>
    <linearGradient id="notfound-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7DF9"/>
      <stop offset="1" stop-color="#8AB4FF"/>
    </linearGradient>
  </defs>

  <!-- Soft radial glow behind the focal motif -->
  <circle cx="280" cy="205" r="150" fill="#4F7DF9" opacity="0.14"/>

  <!-- Dashed "missing link" arc from the main node toward the faint node -->
  <path
    d="M 335 150 A 170 170 0 0 1 470 300"
    fill="none"
    stroke="#2C313A"
    stroke-width="2.5"
    stroke-dasharray="6 8"
    stroke-linecap="round"
    opacity="0.9"
  />
  <path
    d="M 350 265 A 130 130 0 0 1 440 320"
    fill="none"
    stroke="#4F7DF9"
    stroke-width="1.5"
    stroke-dasharray="4 7"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- Faint "missing" node (broken link target) -->
  <circle cx="455" cy="315" r="16" fill="#181B21" stroke="#9AA3B2" stroke-width="2" opacity="0.5"/>
  <circle cx="455" cy="315" r="6" fill="#9AA3B2" opacity="0.4"/>

  <!-- Small broken-link stub near the faint node -->
  <line x1="430" y1="285" x2="440" y2="295" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="440" y1="285" x2="430" y2="295" stroke="#9AA3B2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <!-- Main glowing node -->
  <circle cx="250" cy="200" r="60" fill="url(#notfound-grad)" opacity="0.18"/>
  <circle cx="250" cy="200" r="44" fill="#181B21" stroke="#8AB4FF" stroke-width="3"/>
  <circle cx="250" cy="200" r="58" fill="none" stroke="#4F7DF9" stroke-width="1.5" opacity="0.4"/>
  <circle cx="250" cy="200" r="72" fill="none" stroke="#4F7DF9" stroke-width="1" opacity="0.2"/>

  <!-- "?" glyph inside the main node -->
  <text
    x="250" y="216"
    font-family="Urbanist, Inter, sans-serif"
    font-size="52"
    font-weight="700"
    fill="url(#notfound-grad)"
    text-anchor="middle"
  >?</text>

  <!-- Small orbiting nodes -->
  <circle cx="180" cy="120" r="10" fill="#181B21" stroke="#8AB4FF" stroke-width="2" opacity="0.7"/>
  <circle cx="330" cy="130" r="8" fill="#181B21" stroke="#8AB4FF" stroke-width="2" opacity="0.6"/>
  <circle cx="150" cy="260" r="9" fill="#181B21" stroke="#8AB4FF" stroke-width="2" opacity="0.6"/>
  <circle cx="300" cy="290" r="7" fill="#181B21" stroke="#8AB4FF" stroke-width="2" opacity="0.55"/>

  <!-- Faint links from main node -->
  <g stroke="#2C313A" stroke-width="1.8" opacity="0.7">
    <line x1="250" y1="200" x2="180" y2="120"/>
    <line x1="250" y1="200" x2="330" y2="130"/>
    <line x1="250" y1="200" x2="150" y2="260"/>
    <line x1="250" y1="200" x2="300" y2="290"/>
  </g>
</svg>
