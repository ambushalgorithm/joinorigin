name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [release/*]
    types: [closed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  ARTIFACTS_DIR: app/artifacts

jobs:
  ci-pass-check:
    name: CI Validation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Check CI status on main
        if: github.ref == 'refs/heads/main'
        uses: actions/checkout@v4
      - name: Verify previous CI run passed
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploy triggered from main branch."
          echo "Assumption: CI passed on merge. If CI was skipped, review the merge before proceeding."
      - name: Verify release PR merged
        if: startsWith(github.ref, 'refs/heads/release/')
        run: |
          if [[ "${{ github.event.pull_request.merged }}" != "true" ]]; then
            echo "Release PR must be merged before deployment."
            exit 1
          fi
          echo "Release PR merged. Proceeding to deployment."

  build-and-push:
    name: Build and Push Images
    needs: [ci-pass-check]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build all packages and apps
        working-directory: app
        run: bash scripts/build/build-all.sh

      - name: Set image tag
        id: tag
        run: |
          TAG=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          if [[ "${{ startsWith(github.ref, 'refs/heads/release/') }}" == "true" ]]; then
            TAG="release-${TAG}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Log in to container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker images
        working-directory: app
        run: bash scripts/docker/build-push.sh
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.ARTIFACTS_DIR }}/build/
          retention-days: 7

  deploy-staging:
    name: Deploy to Staging
    needs: [build-and-push]
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging.uwp.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          if [[ "${{ startsWith(github.ref, 'refs/heads/release/') }}" == "true" ]]; then
            TAG="release-${TAG}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy to staging
        working-directory: app
        run: bash scripts/deploy/deploy.sh staging
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_STAGING }}

  deploy-production:
    name: Deploy to Production
    needs: [deploy-staging]
    if: |
      (startsWith(github.ref, 'refs/heads/release/') && github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: https://uwp.local
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: |
          TAG=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}
          if [[ "${{ startsWith(github.ref, 'refs/heads/release/') }}" == "true" ]]; then
            TAG="release-${TAG}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Deploy to production
        working-directory: app
        run: bash scripts/deploy/deploy.sh production
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          REGISTRY: ${{ env.REGISTRY }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY_PRODUCTION }}

  smoke-tests:
    name: Smoke Tests
    needs: [deploy-staging]
    if: always() && needs.deploy-staging.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests against staging
        working-directory: app
        run: bash scripts/test/run-smoke-tests.sh
        env:
          STAGING_URL: https://staging.uwp.local

      - name: Archive smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: ${{ env.ARTIFACTS_DIR }}/test-results/
          retention-days: 7
